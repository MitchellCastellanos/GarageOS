name: Supabase Storage backup (off-platform)

# Weekly copy of the Supabase Storage buckets (public-assets, accounting, communications) -> age-encrypted -> the same
# private R2 bucket under `storage/`. READ-ONLY against Supabase. INERT until the operator opts in:
#   1. repo secrets BACKUP_SUPABASE_URL and BACKUP_SUPABASE_SERVICE_ROLE_KEY (the service-role key is full-admin for
#      the Storage project: only workflows on the default branch can read it; never echo it);
#   2. repo variable STORAGE_BACKUP_ENABLED=true;
#   3. an R2 lifecycle rule for the `storage/` prefix (the existing rule only covers `daily/`).
# Runbook: docs/operations-runbook.md -> "Supabase Storage backup".
on:
  schedule:
    - cron: "41 7 * * 0"   # Sundays 07:41 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: storage-backup
  cancel-in-progress: false

jobs:
  storage:
    if: ${{ vars.STORAGE_BACKUP_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and age
        run: |
          npm ci --ignore-scripts
          sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Copy buckets, build manifest
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.BACKUP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BACKUP_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          : "${NEXT_PUBLIC_SUPABASE_URL:?BACKUP_SUPABASE_URL secret missing}" "${SUPABASE_SERVICE_ROLE_KEY:?BACKUP_SUPABASE_SERVICE_ROLE_KEY secret missing}"
          npx tsx scripts/backup-storage.ts out/storage

      - name: Encrypt (age, public recipient only)
        env:
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          : "${BACKUP_AGE_RECIPIENT:?BACKUP_AGE_RECIPIENT secret missing}"
          ts="$(date -u +%Y-%m-%dT%H%M%SZ)"
          tar -cf - -C out storage | age -r "$BACKUP_AGE_RECIPIENT" -o "out/garageos-storage-$ts.tar.age"
          echo "out/garageos-storage-$ts.tar.age" > out/STORAGE_LATEST

      - name: Upload to R2 and verify size
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.BACKUP_R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.BACKUP_R2_BUCKET }}
        run: |
          f="$(cat out/STORAGE_LATEST)"; key="storage/$(basename "$f")"
          aws s3 cp "$f" "s3://$R2_BUCKET/$key" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          remote="$(aws s3api head-object --bucket "$R2_BUCKET" --key "$key" --endpoint-url "$R2_ENDPOINT" --query ContentLength --output text)"
          local_size="$(stat -c %s "$f")"
          [ "$remote" = "$local_size" ] || { echo "size mismatch: remote=$remote local=$local_size" >&2; exit 1; }
          echo "uploaded $key ($local_size bytes)"
