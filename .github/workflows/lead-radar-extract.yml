name: Lead Radar discovery worker (province extraction)

# Replaces the founder's PC for routine extraction. It does NOTHING unless a Super Admin queued a province run (or opted a province into the schedule) in GarageOS:
# step 1 asks the app (`peek`) whether work exists and exits in seconds when it does not; only then is Python installed and the Overture extractor run.
# Heavy work happens HERE (a GitHub-hosted runner), never in a Vercel request handler. The extractor reads only the public Overture bucket (HTTP range requests);
# records are uploaded in verified, resumable chunks to /api/lead-radar/worker. It never imports, assigns or contacts anyone: it only stages candidates.
#
# Triggers: `schedule` (every 2 hours, default branch only) and `workflow_dispatch`. A MANUAL dispatch defaults to PREFLIGHT (configuration check only): it calls `peek`, then
# dry-runs the Alberta canary plan against the public bucket (footers only). It never claims, extracts or uploads. Untick "preflight" to process a queued run on demand.
#
# Secrets (Settings → Secrets and variables → Actions → Repository secrets; names only): SALES_CRON_BASE_URL = the production origin (https://www.garage-os.ca, no trailing
# slash, no path) and ONE of LEAD_RADAR_WORKER_SECRET (dedicated, least privilege — preferred if you create one in Vercel too) or SALES_CRON_SECRET (= CRON_SECRET in Vercel
# Production, shared with the other cron workers). The dedicated secret wins when both exist.
#
# Cost/limits: GitHub-hosted runner minutes (private repos: 2,000 free min/month on the Free plan; an empty check costs ~1 billed minute, so the 2-hourly schedule ≈ 360 min/month;
# a province run ≈ 5–40 min). Job limit 6 h (we cap at 5 h); no artifacts are stored; the work directory is cached so a re-run resumes finished shards.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      preflight:
        description: "Preflight only: check secrets/URL/authentication via the app and dry-run the Alberta plan (footers). Never claims, extracts or uploads."
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: lead-radar-extract
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PREFLIGHT: ${{ github.event_name == 'workflow_dispatch' && inputs.preflight && 'true' || 'false' }}
    steps:
      - name: Is there queued work? (also the configuration check)
        id: peek
        env:
          SECRET: ${{ secrets.LEAD_RADAR_WORKER_SECRET || secrets.SALES_CRON_SECRET }}
          BASE_URL: ${{ secrets.SALES_CRON_BASE_URL }}
        run: |
          summary() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          if [ -z "$SECRET" ] || [ -z "$BASE_URL" ]; then
            msg="Secrets not configured: SALES_CRON_BASE_URL and LEAD_RADAR_WORKER_SECRET or SALES_CRON_SECRET (Settings → Secrets and variables → Actions)."
            summary "### ❌ $msg"
            echo "pending=false" >> "$GITHUB_OUTPUT"
            if [ "$PREFLIGHT" = "true" ]; then echo "::error::$msg"; exit 1; fi
            echo "::warning::$msg Nothing to do."; exit 0
          fi
          case "$BASE_URL" in https://*) ;; *) echo "::error::SALES_CRON_BASE_URL must be an https origin (https://www.garage-os.ca)"; exit 1;; esac
          case "${BASE_URL#https://}" in */*) echo "::error::SALES_CRON_BASE_URL must be an origin only (no path or trailing slash)"; exit 1;; esac
          code="$(curl -sS -m 60 -o /tmp/peek.json -w '%{http_code}' -X POST -H 'content-type: application/json' -H "Authorization: Bearer ${SECRET}" -d '{"action":"peek"}' "${BASE_URL}/api/lead-radar/worker")" || { echo "::error::peek request failed (network/TLS/URL)"; exit 1; }
          echo "HTTP ${code}"; head -c 200 /tmp/peek.json; echo
          case "$code" in
            200) ;;
            401) echo "::error::HTTP 401: the secret in GitHub does not match CRON_SECRET / LEAD_RADAR_WORKER_SECRET in Vercel Production."; exit 1;;
            301|302|307|308) echo "::error::HTTP ${code}: SALES_CRON_BASE_URL redirects; use the canonical origin https://www.garage-os.ca"; exit 1;;
            *) echo "::error::worker endpoint returned HTTP ${code}"; exit 1;;
          esac
          summary "### ✅ Worker endpoint reachable and authenticated (HTTP 200)"
          summary "\`$(head -c 200 /tmp/peek.json)\`"
          if grep -q '"pending":true' /tmp/peek.json; then echo "pending=true" >> "$GITHUB_OUTPUT"; else echo "pending=false" >> "$GITHUB_OUTPUT"; summary "Nothing is queued: no extraction, import or assignment will happen."; fi

      - uses: actions/checkout@v4
        if: steps.peek.outputs.pending == 'true' || env.PREFLIGHT == 'true'
      - uses: actions/setup-python@v5
        if: steps.peek.outputs.pending == 'true' || env.PREFLIGHT == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/lead-radar/requirements.txt
      - name: Install extractor dependencies
        if: steps.peek.outputs.pending == 'true' || env.PREFLIGHT == 'true'
        run: python -m pip install --disable-pip-version-check -r scripts/lead-radar/requirements.txt

      - name: Preflight — dry-run the Alberta canary plan (footers only, public bucket)
        if: env.PREFLIGHT == 'true'
        run: |
          python scripts/lead-radar/overture_extract.py --plan scripts/lead-radar/plans/alberta-canary.json --out "$RUNNER_TEMP/preflight" --dry-run 2>&1 | tee "$RUNNER_TEMP/dry.txt"
          { echo "### Alberta dry-run (reads Parquet footers only; nothing is extracted or uploaded)"; echo '```'; sed -n '/^{/,$p' "$RUNNER_TEMP/dry.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore resume cache (finished shards survive an interrupted attempt)
        if: steps.peek.outputs.pending == 'true' && env.PREFLIGHT != 'true'
        uses: actions/cache/restore@v4
        with:
          path: lead-radar-work
          key: lead-radar-work-${{ github.run_id }}
          restore-keys: lead-radar-work-
      - name: Run the worker
        id: work
        if: steps.peek.outputs.pending == 'true' && env.PREFLIGHT != 'true'
        env:
          LEAD_RADAR_WORKER_SECRET: ${{ secrets.LEAD_RADAR_WORKER_SECRET || secrets.SALES_CRON_SECRET }}
          BASE_URL: ${{ secrets.SALES_CRON_BASE_URL }}
        run: python scripts/lead-radar/worker.py --base-url "$BASE_URL" --work-dir lead-radar-work
      - name: Save resume cache (also after a failed attempt, so the retry resumes)
        if: always() && steps.peek.outputs.pending == 'true' && env.PREFLIGHT != 'true'
        uses: actions/cache/save@v4
        with:
          path: lead-radar-work
          key: lead-radar-work-${{ github.run_id }}
