name: CI

# Pull-request gate: types, lint, production build, and the full unit/SEO test suite.
# No production secrets and no real database: the build and tests run with placeholder environment
# variables, and the database-backed suites skip themselves (see docs/testing.md and the separate
# database job once it exists). Required status check name for branch protection: "verify".
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Placeholders only. They satisfy the modules that read them at import time; nothing connects.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      NEXTAUTH_SECRET: ci-placeholder-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
      # tsc, eslint and next build exceed Node's default ~2 GB heap on this codebase.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Prisma schema
        run: npx prisma validate
      - name: Type check
        run: npm run typecheck
      - name: Lint (errors fail; warnings are a known backlog)
        run: npm run lint
      - name: Production build
        # NEXTAUTH_URL is set for the build only: with it defined, next-auth wraps requests in a way the
        # auth-claims end-to-end tests (plain Request objects) do not model, so the test step runs without it.
        env:
          NEXTAUTH_URL: http://localhost:3000
        run: npx next build
      - name: Tests (unit, SEO, terminology, rendered HTML)
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      - name: Tests must not be silently skipped
        run: node scripts/ci/check-skips.mjs test-output.log
