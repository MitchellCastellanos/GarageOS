name: Lead Radar automation worker (every 15 minutes, 7 days a week)

# Calls the SAME idempotent endpoint the daily Vercel cron (vercel.json) calls, more often, so qualification / CRM handoff / assignment advance
# without anyone clicking. The endpoint is a no-op unless BOTH switches are on (live discovery AND the Lead Radar automation master switch,
# both OFF by default), uses a single-runner lease so overlaps are harmless, never sends email, and rejects any request without
# `Authorization: Bearer <LEAD_RADAR_CRON_SECRET or CRON_SECRET>`.
#
# Required repository secrets (names only): LEAD_RADAR_CRON_SECRET (= LEAD_RADAR_CRON_SECRET in Vercel Production; authorizes ONLY this endpoint) and
# SALES_CRON_BASE_URL (the production origin, e.g. https://www.garage-os.ca — no trailing slash).
on:
  schedule:
    - cron: "*/15 11-23 * * *"   # every day (Mon-Sun), 11:00-23:59 UTC. GitHub may delay or skip scheduled runs under load; the lease + idempotent stages make catch-up safe.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: lead-radar-cron
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the Lead Radar automation worker
        env:
          SECRET: ${{ secrets.LEAD_RADAR_CRON_SECRET }}
          BASE_URL: ${{ secrets.SALES_CRON_BASE_URL }}
        run: |
          if [ -z "$SECRET" ] || [ -z "$BASE_URL" ]; then
            echo "::error::LEAD_RADAR_CRON_SECRET and/or SALES_CRON_BASE_URL repository secrets are not configured; failing so the missing automation is visible (the daily Vercel cron still runs)."
            exit 1
          fi
          case "$BASE_URL" in https://*) ;; *) echo "::error::SALES_CRON_BASE_URL must be an https origin"; exit 1;; esac
          code="$(curl -sS -m 90 -o /tmp/out.json -w '%{http_code}' -H "Authorization: Bearer ${SECRET}" "${BASE_URL%/}/api/webhooks/cron/lead-radar")" || { echo "::error::request failed"; exit 1; }
          echo "HTTP ${code}"
          head -c 300 /tmp/out.json; echo
          [ "$code" = "200" ] || { echo "::error::Lead Radar worker returned HTTP ${code}"; exit 1; }
